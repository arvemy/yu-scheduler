<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="theme-color" content="#1976d2" />
		<title>YU Scheduler - Course Planner</title>
		<meta
			name="description"
			content="YU Scheduler helps Yasar University students plan and generate course schedules."
		/>
		<meta
			name="keywords"
			content="yasar university, course scheduler, course planner, schedule generator, university timetable, course selection"
		/>
		<meta name="author" content="Arda Korkmaz" />
		<meta name="robots" content="index, follow" />
		<meta name="language" content="en" />
		<link rel="canonical" href="https://yuscheduler.com/" />

		<!-- Open Graph / Facebook -->
		<meta property="og:title" content="YU Scheduler - Course Planner" />
		<meta
			property="og:description"
			content="Select your courses and generate a schedule. Modern, fast, and easy to use!"
		/>
		<meta property="og:type" content="website" />
		<meta property="og:url" content="https://yuscheduler.com/" />
		<meta property="og:image" content="/logo192.png" />
		<meta property="og:site_name" content="YU Scheduler" />
		<meta property="og:locale" content="en_US" />

		<!-- Twitter -->
		<meta name="twitter:card" content="summary_large_image" />
		<meta name="twitter:title" content="YU Scheduler - Course Planner" />
		<meta
			name="twitter:description"
			content="Plan your courses and generate a schedule. Modern, fast, and easy to use!"
		/>
		<meta name="twitter:image" content="/logo192.png" />
		<meta name="twitter:site" content="@yuscheduler" />
		<link rel="icon" href="/favicon.ico" />
		<link rel="apple-touch-icon" href="/logo192.png" />
		<link rel="apple-touch-icon" sizes="180x180" href="/logo180.png" />
		<link rel="manifest" href="/manifest.json" />
		<!-- Preload self-hosted fonts to prevent CLS -->
		<link rel="preload" as="font" type="font/woff2" href="/fonts/montserrat-600.woff2" crossorigin />
		<link rel="preload" as="font" type="font/woff2" href="/fonts/montserrat-700.woff2" crossorigin />
		<link rel="preload" as="font" type="font/woff2" href="/fonts/montserrat-800.woff2" crossorigin />
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
